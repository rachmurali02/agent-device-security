[package]
name = "quorum-firmware-rp2350"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "The quorum HSM on a Raspberry Pi Pico 2 (RP2350)"
publish = false

[[bin]]
name = "quorum-firmware"
path = "src/main.rs"
test = false
bench = false

[dependencies]
quorum-core = { path = "../../crates/core" }
quorum-device = { path = "../../crates/device" }

embassy-rp = { version = "0.10.0", features = ["rp235xa", "time-driver", "critical-section-impl"] }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-usb = { version = "0.6.0", default-features = false }
embassy-time = "0.5.1"
embassy-futures = "0.1"
cortex-m-rt = "0.7.7"
panic-halt = "1.0.0"
rand_core = { version = "0.6", default-features = false }
static_cell = "2.1.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
debug = 2
panic = "abort"
