[package]
name = "quorum-wallet"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Agent wallet: lets AI agents act through the quorum HSM, with the user approving on a web page"

[[bin]]
name = "quorum-wallet"
path = "src/main.rs"

[dependencies]
quorum-core = { path = "../core" }
quorum-client = { path = "../client" }
ed25519-dalek = "2"
rand_core = { version = "0.6", features = ["getrandom"] }
serde_json = "1"
tiny_http = "0.12"

[dev-dependencies]
quorum-emulator = { path = "../emulator" }
