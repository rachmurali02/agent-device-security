[package]
name = "quorum-pkcs11"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "PKCS#11 library that lets standard tools use the quorum HSM"

[lib]
name = "quorum_pkcs11"
crate-type = ["cdylib", "rlib"]

[dependencies]
cryptoki-sys = "0.5.0"
ed25519-dalek = "2"
quorum-core = { path = "../core" }

[dev-dependencies]
quorum-emulator = { path = "../emulator" }
