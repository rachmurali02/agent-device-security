[package]
name = "quorum-emulator"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Runs the quorum HSM core as a local daemon over a Unix socket"

[dependencies]
quorum-core = { path = "../core" }
rand_core = { version = "0.6", features = ["getrandom"] }
quorum-device = { path = "../device" }
serialport = { version = "4.10.1", default-features = false }
