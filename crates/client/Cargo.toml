[package]
name = "quorum-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Host-side connection to the quorum HSM"

[dependencies]
quorum-core = { path = "../core" }
# Talks to the real device over USB serial. No libudev: we only open ports
# by name, never list them.
serialport = { version = "4.10.1", default-features = false }
