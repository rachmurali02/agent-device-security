[package]
name = "quorum-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Command-line tool for agent keys: create, act, confirm, verify"

[[bin]]
name = "quorum"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
ed25519-dalek = "2"
quorum-client = { path = "../client" }
quorum-core = { path = "../core" }
rand_core = { version = "0.6", features = ["getrandom"] }
