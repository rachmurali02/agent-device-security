[workspace]
resolver = "3"
# The fuzzer has its own workspace (it needs a nightly compiler).
exclude = ["fuzz"]
members = [
    "crates/core",
    "crates/emulator",
    "crates/client",
    "crates/pkcs11",
    "crates/cli", "crates/bench",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"

[profile.release]
panic = "abort"
