name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: thumbv8m.main-none-eabihf
      - run: sudo apt-get update && sudo apt-get install -y opensc
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Core builds for the RP2350 microcontroller (no OS)
        run: cargo build -p quorum-core --release --target thumbv8m.main-none-eabihf
      - run: ./scripts/demo.sh
      - run: ./scripts/demo-agent.sh
