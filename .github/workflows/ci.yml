name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy, rustfmt
          targets: thumbv8m.main-none-eabihf
      - run: sudo apt-get update && sudo apt-get install -y opensc softhsm2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Core builds for the RP2350 microcontroller (no OS)
        run: cargo build -p quorum-core --release --target thumbv8m.main-none-eabihf
      - run: ./scripts/demo.sh
      - run: ./scripts/demo-agent.sh
      - name: Benchmark smoke test (small run; checks the harness and attacks still work)
        run: cargo build --release -p quorum-bench && target/release/quorum-bench --iterations 50 --data /tmp/run.tsv && tools/plot_benchmarks.py /tmp/run.tsv > /dev/null
