<text class="t-axis" x="600.0" y="376" text-anchor="middle">64</text>
<text class="t-axis" x="500.0" y="392" text-anchor="middle">clients sending at once</text>
<path class="line l1 dash" d="M400.0,356.1 L433.3,352.8 L466.7,342.1 L500.0,330.3 L533.3,302.6 L566.7,253.4 L600.0,136.8"/>
<circle class="dot s1" cx="400.0" cy="356.1" r="4"><title>1 clients: 99% within 0.8 ms</title></circle>
<circle class="dot s1" cx="433.3" cy="352.8" r="4"><title>2 clients: 99% within 1.4 ms</title></circle>
<circle class="dot s1" cx="466.7" cy="342.1" r="4"><title>4 clients: 99% within 3.6 ms</title></circle>
