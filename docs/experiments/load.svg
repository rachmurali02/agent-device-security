<circle class="dot s1" cx="566.7" cy="253.4" r="4"><title>32 clients: 99% within 21.3 ms</title></circle>
<circle class="dot s1" cx="600.0" cy="136.8" r="4"><title>64 clients: 99% within 44.6 ms</title></circle>
<text class="t-label" x="610.0" y="140.8">99th pct</text>
<path class="line l1" d="M400.0,358.7 L433.3,357.6 L466.7,354.0 L500.0,348.8 L533.3,338.5 L566.7,317.5 L600.0,290.2"/>
<circle class="dot s1" cx="400.0" cy="358.7" r="4"><title>1 clients: median 0.27 ms</title></circle>
<circle class="dot s1" cx="433.3" cy="357.6" r="4"><title>2 clients: median 0.48 ms</title></circle>
<circle class="dot s1" cx="466.7" cy="354.0" r="4"><title>4 clients: median 1.21 ms</title></circle>
<circle class="dot s1" cx="500.0" cy="348.8" r="4"><title>8 clients: median 2.25 ms</title></circle>
<circle class="dot s1" cx="533.3" cy="338.5" r="4"><title>16 clients: median 4.30 ms</title></circle>
<circle class="dot s1" cx="566.7" cy="317.5" r="4"><title>32 clients: median 8.49 ms</title></circle>
<circle class="dot s1" cx="600.0" cy="290.2" r="4"><title>64 clients: median 13.95 ms</title></circle>
<text class="t-label" x="610.0" y="294.2">median</text>
<text class="t-note" x="340" y="414">More clients = a longer line to wait in.</text>
<text class="t-title" x="680" y="88">One client's median wait while others…</text>
<text class="t-label" x="680" y="120">Nobody else (baseline)</text>
<path class="s1" d="M680,126 h15.1 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-15.1 z"><title>Nobody else (baseline): median 238 µs</title></path>
<text class="t-value" x="705.1" y="138">0.24 ms (1.0x)</text>
<text class="t-label" x="680" y="156">200 idle connections</text>
<path class="s1" d="M680,162 h19.1 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-19.1 z"><title>200 idle connections: median 289 µs</title></path>
<text class="t-value" x="709.1" y="174">0.29 ms (1.2x)</text>
<text class="t-label" x="680" y="192">8 flooding, no PIN</text>
<path class="s1" d="M680,198 h20.3 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-20.3 z"><title>8 flooding, no PIN: median 304 µs</title></path>
<text class="t-value" x="710.3" y="210">0.30 ms (1.3x)</text>
<text class="t-label" x="680" y="228">100 half-sent requests</text>
<path class="s1" d="M680,234 h17.0 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-17.0 z"><title>100 half-sent requests: median 262 µs</title></path>
<text class="t-value" x="707.0" y="246">0.26 ms (1.1x)</text>
<text class="t-label" x="680" y="264">8 sending garbage</text>
<path class="s1" d="M680,270 h26.3 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-26.3 z"><title>8 sending garbage: median 379 µs</title></path>
<text class="t-value" x="716.3" y="282">0.38 ms (1.6x)</text>
<text class="t-label" x="680" y="300">8 with PIN: refused actions</text>
<path class="s1" d="M680,306 h114.7 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-114.7 z"><title>8 with PIN: refused actions: median 1483 µs</title></path>
<text class="t-value" x="804.7" y="318">1.48 ms (6.2x)</text>
<text class="t-label" x="680" y="336">8 with PIN: payments</text>
<path class="s1" d="M680,342 h176.0 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-176.0 z"><title>8 with PIN: payments: median 2248 µs</title></path>
<text class="t-value" x="866.0" y="354">2.25 ms (9.4x)</text>
<text class="t-note" x="680" y="414">Without the PIN, others barely slow it down.</text>
