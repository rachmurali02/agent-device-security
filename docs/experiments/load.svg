<line class="grid" x1="400" y1="110.0" x2="600" y2="110.0"/>
<text class="t-axis" x="394" y="114.0" text-anchor="end">50 ms</text>
<text class="t-axis" x="400.0" y="376" text-anchor="middle">1</text>
<text class="t-axis" x="433.3" y="376" text-anchor="middle">2</text>
